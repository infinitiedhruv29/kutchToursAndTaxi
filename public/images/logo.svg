  <text x="52" y="39" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#DCA134" letter-spacing="2.2">TOURS &amp; TAXI</text>
